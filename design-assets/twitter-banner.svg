<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#004ac6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#F97316" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bgGradient)"/>

  <!-- Globe on the left -->
  <g transform="translate(200,250)">
    <circle cx="0" cy="0" r="100" stroke="rgba(255,255,255,0.3)" stroke-width="4" fill="none"/>

    <!-- Globe lines -->
    <path d="M -100,0 C -100,-50 -50,-100 0,-100 C 50,-100 100,-50 100,0 C 100,50 50,100 0,100 C -50,100 -100,50 -100,0 Z"
          stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M -100,0 C -100,50 -50,100 0,100 C 50,100 100,50 100,0 C 100,-50 50,-100 0,-100 C -50,-100 -100,-50 -100,0 Z"
          stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" opacity="0.5"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  </g>

  <!-- Flight path -->
  <path d="M 100,150 Q 300,50 500,150 Q 600,200 580,250 L 450,350 Q 350,400 250,400 Q 150,400 100,350 L 50,250 Q 30,200 50,150 Z"
        fill="rgba(249,115,22,0.2)" stroke="#F97316" stroke-width="4"/>

  <!-- Plane -->
  <g transform="translate(50,250) rotate(-20)">
    <polygon points="0,0 20,-10 20,-2 40,-2 40,2 20,2 20,10" fill="#F97316"/>
    <rect x="20" y="-1" width="20" height="2" fill="#F97316"/>
  </g>

  <!-- Text -->
  <text x="800" y="200" text-anchor="left" font-family="Inter, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF">
    ChanderGari
  </text>
  <text x="800" y="300" text-anchor="left" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#E2E8F0">
    Your journey, perfectly mapped out
  </text>

  <!-- Feature icons -->
  <g transform="translate(800,380)">
    <!-- Itinerary -->
    <g transform="translate(0,0)">
      <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.1)"/>
      <polygon points="-8,0 0,-12 8,0" fill="#F97316"/>
      <text x="30" y="8" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">
        Smart Itineraries
      </text>
    </g>

    <!-- AI Guide -->
    <g transform="translate(200,0)">
      <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.1)"/>
      <circle cx="0" cy="0" r="12" fill="#F97316"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFFFFF" stroke-width="2"/>
      <text x="30" y="8" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">
        AI Tour Guide
      </text>
    </g>

    <!-- Budget -->
    <g transform="translate(400,0)">
      <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.1)"/>
      <polygon points="-10,-10 10,-10 0,10" fill="#F97316"/>
      <text x="30" y="8" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">
        Budget Advisor
      </text>
    </g>
  </g>
</svg>